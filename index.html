<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Sky·光遇：光遇资源网盘导航，一键直达。">
  <meta property="og:title" content="Sky·光遇 · 网盘导航">
  <meta property="og:description" content="与光相遇 · 资源直达。">
  <title>Sky·光遇 · 网盘导航</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=20261107i">
</head>
<body>

  <!-- ====== 首屏 ====== -->
  <section class="intro" id="intro">
    <canvas id="background" aria-hidden="true"></canvas>
    <canvas id="flow" aria-hidden="true"></canvas>
    <div class="intro-veil" aria-hidden="true"></div>
    <div class="intro-inner">
      <h1 class="intro-title" id="intro-title">Sky·光遇</h1>
      <p class="intro-sub" id="intro-sub">网盘资源 · 一键直达</p>
      <button class="enter" id="enterBtn" type="button" aria-label="进入导航">
        <span class="enter-ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M19 12l-7 7-7-7"/>
          </svg>
        </span>
      </button>
    </div>
    <span class="intro-tip">轻触箭头进入</span>
  </section>

  <!-- ====== 主屏 ====== -->
  <section class="main" id="main" aria-hidden="true">

    <header class="topbar">
      <span class="topbar-brand">Sky·光遇</span>
      <span class="topbar-count" id="counter">5 个入口</span>
    </header>

    <!-- 名片卡 -->
    <div class="card-wrap">
      <div class="card" id="card">
        <div class="card-inner">
          <img class="card-avatar" src="assets/avatar.png" alt="Sky·光遇 头像">
          <h1 id="card-title">Sky·光遇</h1>
          <p class="card-slogan" id="card-slogan"></p>
          <ul class="card-links" id="card-links"></ul>
        </div>
      </div>
    </div>

    <!-- 提示条 -->
    <div class="notice-wrap" id="notice-wrap">
      <div class="notice" id="notice">
        <span class="notice-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <path d="M12 9v4M12 17h.01"/>
          </svg>
        </span>
        <div class="notice-body">
          <div class="notice-title" id="notice-title"></div>
          <ol class="notice-list" id="notice-list"></ol>
        </div>
      </div>
    </div>

    <!-- 网盘下载 -->
    <section class="downloads" id="downloads">
      <h2 id="downloads-title">网盘下载</h2>
      <p class="downloads-sub" id="downloads-sub"></p>
      <div class="downloads-grid" id="downloads-grid"></div>
    </section>

    <!-- 关于 -->
    <section class="about" id="about">
      <h2 id="about-title">关于本站</h2>
      <div class="about-body" id="about-body"></div>
    </section>

    <footer class="site-footer">
      <span id="copyright"></span>
    </footer>
  </section>

  <script src="links.js?v=20261107i"></script>
  <script src="fluid.js?v=20261107i"></script>
  <script src="app.js?v=20261107i"></script>
</body>
</html>
